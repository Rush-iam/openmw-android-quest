plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.bugsnag.android.gradle'
    id 'com.meta.spatial.plugin'
}

ext {
    versionFile = new File(project.rootDir, 'app/src/main/assets/libopenmw/resources/version')
    calculateVersionCode = {
        return (new Date().getTime() / 1000).intValue()
    }
    calculateVersion = {
        stream = new FileInputStream(versionFile)
        return stream.readLines()[0].trim() + "-" + project.android.defaultConfig.versionCode.toString()
    }
}

android {
    compileSdkVersion 30
    compileOptions {
        targetCompatibility JavaVersion.VERSION_21
        sourceCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }

    sourceSets {
        main {
            resources {
                srcDir {
                    // To include the wrap.sh script required by ASAN
                    "wrap/res"
                }
            }
        }
    }

    defaultConfig {
        applicationId "com.queststoredb.openmw_quest"
        versionCode calculateVersionCode()
        versionName calculateVersion()

        minSdkVersion 21
        // Do not update past 29 -- see https://github.com/xyzz/openmw-android/issues/30
        targetSdkVersion 29

        buildConfigField("int", "RANDOMIZER", Math.abs(new Random().nextInt(999)).toString())
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
        }

        debug {
            applicationIdSuffix ".debug"
            debuggable false
        }
    }

    flavorDimensions "version", "device"

    productFlavors {
        nightly {
            dimension "version"
            applicationId "com.queststoredb.openmw_quest"
            versionNameSuffix "-nightly"
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding true
    }
    productFlavors {
        create("mobile") { dimension = "device" }
        create("quest") { dimension = "device" }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "omw_${variant.buildType.name}_${defaultConfig.versionName}.apk"
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
        }
    }
    ndkVersion '27.3.13750724'
    namespace 'com.libopenmw.openmw'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    implementation project(':storagechooser')

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.4.0"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.0'

    implementation files('lib/commons-base-0.10.8.aar')
    implementation files('lib/anko-commons-0.10.8.aar')
    implementation files('lib/sqlite-base-0.10.8.aar')
    implementation files('lib/anko-sqlite-0.10.8.aar')

    implementation 'com.bugsnag:bugsnag-android-ndk:5.32.4'

    testImplementation 'junit:junit:4.13.2'
}
