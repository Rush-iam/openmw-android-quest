// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.9.22'
    ext.anko_version = '0.10.8'
    ext.spatialsdk_version = "0.10.1"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.bugsnag:bugsnag-android-gradle-plugin:8.2.0'
        classpath "com.meta.spatial.plugin:com.meta.spatial.plugin.gradle.plugin:${spatialsdk_version}"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
            content {
                // For some reason gradle attempts to get bugsnag from here, which returns 522
                // after which gradle just drops jitpack. Exclude so it doesn't bother trying.
                excludeGroupByRegex ".*bugsnag.*"
            }
        }
    }
}

apply plugin: 'idea'

idea.module {
    excludeDirs += file('buildscripts/')
}
